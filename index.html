<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>معاينة محرك رسم الشموع وأدوات ICT</title>
  <script src="https://cdn.jsdelivr.net/npm/klinecharts/dist/klinecharts.min.js"></script>
  <style>
    :root {
      --bg: #050a0f;
      --surface: #0a1520;
      --border: #1a3a5c;
      --accent: #00d4ff;
      --text: #c8dde8;
    }
    body {
      margin: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: var(--surface);
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .main-container {
      display: flex;
      flex: 1;
      position: relative;
    }
    /* شريط أدوات الرسم الجانبي */
    .toolbar {
      width: 60px;
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0;
      gap: 12px;
    }
    .tool-btn {
      width: 40px;
      height: 40px;
      background: #0f1e2e;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tool-btn:hover, .tool-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }
    /* حاوية الشارت الأساسية */
    #chart {
      flex: 1;
      height: 100%;
    }
  </style>
</head>
<body>

  <header>
    <h3>منصة اختبار أدوات الرسم والمحاكاة المخصصة</h3>
    <div>الزوج الافتراضي: XAUUSD</div>
  </header>

  <div class="main-container">
    <div class="toolbar">
      <button class="tool-btn" onclick="setShape('trendLine')" title="خط اتجاه">📈</button>
      <button class="tool-btn" onclick="setShape('horizontalLine')" title="خط أفقي">➖</button>
      <button class="tool-btn" onclick="setShape('rect')" title="منطقة FVG / OrderBlock">🟩</button>
      <button class="tool-btn" onclick="setShape('fibonacciRetracement')" title="مستويات الفيبوناتشي">🎯</button>
      <button class="tool-btn" onclick="clearShapes()" title="مسح الرسومات" style="background: #ff446622; color: #ff4466;">❌</button>
    </div>

    <div id="chart"></div>
  </div>

  <script>
    let chart;

    // 1. توليد بيانات شموع وهمية مسبقة لملء الشارت فوراً
    function generateMockData() {
      const data = [];
      let basePrice = 2320;
      let timestamp = Date.now() - 100 * 60 * 15 * 1000;
      
      for (let i = 0; i < 100; i++) {
        const open = basePrice + (Math.random() - 0.5) * 10;
        const close = open + (Math.random() - 0.4) * 12;
        const high = Math.max(open, close) + Math.random() * 5;
        const low = Math.min(open, close) - Math.random() * 5;
        
        data.push({ timestamp, open, high, low, close, volume: Math.random() * 1000 });
        basePrice = close;
        timestamp += 15 * 60 * 1000; // فريم 15 دقيقة
      }
      return data;
    }

    // 2. تهيئة وتخصيص محرك الشارت بالألوان الداكنة
    function initChart() {
      chart = klinecharts.init('chart');
      
      // تطبيق الثيم المظلم بالكامل
      chart.setStyles({
        grid: { show: true, horizontal: { color: '#1a3a5c' }, vertical: { color: '#1a3a5c' } },
        candle: {
          type: 'candle_solid',
          bar: { upColor: '#00ff88', downColor: '#ff4466' },
          priceMark: { last: { show: true, color: '#00d4ff' } }
        }
      });

      // ضخ البيانات داخل المحرك لتظهر الشموع فوراً
      const mockData = generateMockData();
      chart.applyNewData(mockData);
    }

    // 3. تفعيل أداة الرسم المحددة عند النقر على الزر الجانبي
    function setShape(shapeName) {
      // إخبار المحرك بالتقاط النقرة القادمة من الفأرة على الكانفاس ورسم الأداة
      chart.createOverlay({
        name: shapeName,
        lock: false,
        styles: {
          line: { color: '#00d4ff', size: 2 },
          polygon: { color: 'rgba(0, 212, 255, 0.15)' }
        }
      });
    }

    // 4. دالة مسح كافة الرسومات من فوق الشارت
    function clearShapes() {
      chart.removeOverlay();
    }

    // تشغيل المحرك تلقائياً عند فتح الملف
    window.onload = initChart;
  </script>
</body>
</html>
