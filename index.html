<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradingView Clone - Pro Interface</title>
  <script src="https://cdn.jsdelivr.net/npm/klinecharts/dist/klinecharts.min.js"></script>
  <style>
    :root {
      --bg-color: #131722;
      --panel-bg: #1e222d;
      --border-color: #2a2e39;
      --text-active: #d1d4dc;
      --text-muted: #787b86;
      --accent: #2962ff;
      --accent-hover: #1e53e5;
      --up-color: #089981;
      --down-color: #f23645;
      --hover-bg: #2a2e39;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-active);
      font-family: -apple-system, BlinkMacSystemFont, 'Trebuchet MS', Roboto, Ubuntu, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Toolbar */
    .tv-top-toolbar {
      height: 40px;
      min-height: 40px;
      background-color: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 16px;
      font-size: 14px;
      font-weight: 500;
    }

    .tv-divider {
      width: 1px;
      height: 24px;
      background-color: var(--border-color);
    }

    .tv-symbol {
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .tv-symbol:hover { color: #fff; }

    .tv-timeframes {
      display: flex;
      gap: 4px;
    }

    .tv-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 13px;
      transition: all 0.1s ease;
    }

    .tv-btn:hover {
      color: var(--text-active);
      background-color: var(--hover-bg);
    }

    .tv-btn.active {
      color: var(--accent);
    }

    /* Main Container */
    .tv-main-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 40px);
    }

    /* Left Toolbar */
    .tv-left-toolbar {
      width: 52px;
      min-width: 52px;
      background-color: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 0;
      gap: 6px;
    }

    .tv-tool-icon {
      width: 32px;
      height: 32px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 4px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 16px;
    }

    .tv-tool-icon:hover {
      background-color: var(--hover-bg);
      color: var(--text-active);
    }

    .tv-tool-icon.active {
      color: var(--accent);
      background-color: rgba(41, 98, 255, 0.1);
    }

    .tv-tool-icon svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Chart Container */
    .tv-chart-wrapper {
      flex: 1;
      position: relative;
      background-color: var(--bg-color);
    }

    #tv_chart_engine {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div class="tv-top-toolbar">
    <div class="tv-symbol">XAUUSD</div>
    <div class="tv-divider"></div>
    <div class="tv-timeframes">
      <button class="tv-btn">1m</button>
      <button class="tv-btn">5m</button>
      <button class="tv-btn active">15m</button>
      <button class="tv-btn">1h</button>
      <button class="tv-btn">4h</button>
      <button class="tv-btn">D</button>
    </div>
    <div class="tv-divider"></div>
    <button class="tv-btn">Indicators</button>
    <button class="tv-btn">Alert</button>
    <button class="tv-btn">Replay</button>
    <div style="flex:1;"></div>
    <button class="tv-btn">⚙️</button>
    <button class="tv-btn">⛶</button>
  </div>

  <div class="tv-main-container">
    <div class="tv-left-toolbar">
      <div class="tv-tool-icon active" onclick="setDrawingTool(this, 'pointer')" title="Crosshair">
        <svg viewBox="0 0 28 28"><path d="M13.5 4.5v20h1v-20h-1zm5 9.5h-20v1h20v-1z"/></svg>
      </div>
      <div class="tv-tool-icon" onclick="setDrawingTool(this, 'trendLine')" title="Trend Line">
        <svg viewBox="0 0 28 28"><path d="M22.12 7.29L6.71 22.71l-1.42-1.42L20.71 5.88l1.41 1.41z"/></svg>
      </div>
      <div class="tv-tool-icon" onclick="setDrawingTool(this, 'horizontalLine')" title="Horizontal Line">
        <svg viewBox="0 0 28 28"><path d="M4 13.5h20v1H4v-1z"/></svg>
      </div>
      <div class="tv-tool-icon" onclick="setDrawingTool(this, 'rayLine')" title="Ray">
        <svg viewBox="0 0 28 28"><path d="M6 14.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm1.5-1h17v1h-17v-1z"/></svg>
      </div>
      <div class="tv-tool-icon" onclick="setDrawingTool(this, 'fibonacciRetracement')" title="Fibonacci Retracement">
        <svg viewBox="0 0 28 28"><path d="M4 8.5h20v1H4v-1zm0 5h20v1H4v-1zm0 5h20v1H4v-1zM9 5.5v16h1v-16H9zm9 0v16h1v-16h-1z"/></svg>
      </div>
      <div class="tv-tool-icon" onclick="setDrawingTool(this, 'rect')" title="Rectangle">
        <svg viewBox="0 0 28 28"><path fill-rule="evenodd" d="M6 7h16v14H6V7zm1 1v12h14V8H7z"/></svg>
      </div>
      
      <div class="tv-divider" style="height: 1px; width: 24px; margin: 4px 0;"></div>
      
      <div class="tv-tool-icon" onclick="chartEngine.removeOverlay()" title="Remove Drawings" style="color: var(--down-color);">
        <svg viewBox="0 0 28 28"><path d="M10 6.5h8V5h-8v1.5zM8.5 7h11l-.7 15H9.2l-.7-15zm-3-.5h17v1h-17v-1z"/></svg>
      </div>
    </div>

    <div class="tv-chart-wrapper">
      <div id="tv_chart_engine"></div>
    </div>
  </div>

  <script>
    let chartEngine;

    // توليد بيانات هيكلية لتعبئة الشارت
    function generateMarketData() {
      const data = [];
      let price = 2320.0;
      let timestamp = Date.now() - 200 * 15 * 60 * 1000;
      
      for (let i = 0; i < 200; i++) {
        const volatility = (Math.random() - 0.5) * 8;
        const open = price;
        const close = price + volatility;
        const high = Math.max(open, close) + Math.random() * 4;
        const low = Math.min(open, close) - Math.random() * 4;
        
        data.push({ timestamp, open, high, low, close, volume: Math.random() * 1000 });
        price = close;
        timestamp += 15 * 60 * 1000;
      }
      return data;
    }

    function initChart() {
      // تهيئة المحرك وتطبيق إعدادات بصرية مطابقة لـ TradingView
      chartEngine = klinecharts.init('tv_chart_engine');
      
      chartEngine.setStyles({
        grid: {
          show: true,
          horizontal: { color: '#1e222d', style: 'solid', size: 1 },
          vertical: { color: '#1e222d', style: 'solid', size: 1 }
        },
        candle: {
          type: 'candle_solid',
          bar: {
            upColor: '#089981',
            downColor: '#f23645',
            noChangeColor: '#089981',
            upBorderColor: '#089981',
            downBorderColor: '#f23645',
            upWickColor: '#089981',
            downWickColor: '#f23645'
          },
          priceMark: {
            show: true,
            high: { show: false },
            low: { show: false },
            last: {
              show: true,
              upColor: '#089981',
              downColor: '#f23645',
              noChangeColor: '#089981',
              text: { color: '#ffffff' }
            }
          }
        },
        xAxis: {
          axisLine: { color: '#2a2e39', size: 1 },
          tickLine: { color: '#2a2e39', size: 1 },
          tickText: { color: '#787b86', size: 12 }
        },
        yAxis: {
          axisLine: { color: '#2a2e39', size: 1 },
          tickLine: { color: '#2a2e39', size: 1 },
          tickText: { color: '#787b86', size: 12 }
        },
        crosshair: {
          show: true,
          horizontal: { line: { color: '#787b86', style: 'dashed', size: 1 } },
          vertical: { line: { color: '#787b86', style: 'dashed', size: 1 } }
        }
      });

      chartEngine.applyNewData(generateMarketData());
    }

    // إدارة تفعيل أدوات الرسم
    function setDrawingTool(element, toolName) {
      document.querySelectorAll('.tv-tool-icon').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');

      if (toolName === 'pointer') {
        chartEngine.overrideOverlay({ lock: true });
        return;
      }

      chartEngine.createOverlay({
        name: toolName,
        lock: false,
        styles: {
          line: { color: '#2962ff', size: 2 },
          polygon: { color: 'rgba(41, 98, 255, 0.2)', border: { color: '#2962ff' } }
        }
      });
    }

    // تعديل الفريم الزمني (مظهري فقط للواجهة)
    document.querySelectorAll('.tv-timeframes .tv-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.tv-timeframes .tv-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
      });
    });

    window.onload = initChart;
    window.addEventListener('resize', () => { chartEngine.resize(); });
  </script>
</body>
</html>
